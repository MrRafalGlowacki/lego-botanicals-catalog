name: Aktualizacja katalogu LEGO Botanicals

on:
  schedule:
    # Uruchamianie w każdy poniedziałek o 4:00 rano
    - cron: '0 4 * * 1'
  workflow_dispatch: # Umożliwia ręczne kliknięcie "Run" w dowolnym momencie

permissions:
  contents: write # Dostęp do zapisu zaktualizowanego pliku catalog.json

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj środowisko Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj biblioteki
        run: |
          pip install requests beautifulsoup4

      - name: Uruchom skrypt aktualizujący bazę
        run: python updater.py

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "Katalog Bot"
          git config --global user.email "bot@github.com"
          git add catalog.json
          git commit -m "Automatyczna aktualizacja katalogu LEGO [skip ci]" || exit 0
          git push
